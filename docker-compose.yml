name: report-city

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reportcity}
      POSTGRES_USER: ${POSTGRES_USER:-reportcity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reportcity}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
