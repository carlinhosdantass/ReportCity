name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up project tools
        uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Run the local CI task
        run: mise run ci
